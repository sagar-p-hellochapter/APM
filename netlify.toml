# Netlify config for the Chapter PM Assistant Portal.
# Assembles a publish dir containing the portal HTML + the live data layer, so the
# hosted page fetches fresh data/*.json (regenerated by the GitHub Actions refresh).

[build]
  command = "mkdir -p public && cp portal/index.html public/index.html && cp -r data public/data"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

# Always serve fresh JSON; cache the shell lightly.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
